[project]
name = "1-programacion-avanzada-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alvaro Figueroa", email = "alvarofigueplaza@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
1-programacion-avanzada-python = "1_programacion_avanzada_python:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "integration: tests que dependen de datos reales o I/O pesado"
]